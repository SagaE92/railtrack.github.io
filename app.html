<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailTrack App</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Share Tech Mono', monospace; background:#0a0a0a; color:#f3f1ea; margin:0; padding:0; }
  a { color:#f5c518; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .top { padding:12px 16px 0; }
  .tabs { display:flex; border-bottom:1px solid #2a261c; position:sticky; top:0; background:#0a0a0a; z-index:2; }
  .tab { flex:1; text-align:center; padding:12px 0; background:none; border:none; color:#b8b4a8; font-family:inherit; font-size:0.95rem; cursor:pointer; min-height:44px; }
  .tab.active { color:#f5c518; border-bottom:2px solid #f5c518; }
  .view { display:none; padding:16px; }
  .view.active { display:block; }
  .panel { background:#000; border:1px solid #2a261c; border-radius:16px; padding:16px; margin-bottom:12px; }
  label { display:block; margin:8px 0 4px; font-size:0.85rem; color:#b8b4a8; }
  input[type=number], select, input[type=text] { background:#1a1a1a; color:#f3f1ea; border:1px solid #3a3428; border-radius:4px; padding:6px 10px; font-family:inherit; width:100px; }
  button { background:#1a1a1a; color:#f5c518; border:1px solid #3a3428; border-radius:4px; padding:10px 16px; font-family:inherit; cursor:pointer; margin:4px; min-height:44px; }
  button:hover { background:#2a261c; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .readout { font-size:32px; margin:8px 0 4px; line-height:1.1; }
  .readout-sub { font-size:0.8rem; color:#b8b4a8; margin-bottom:8px; }
  .cant { font-size:0.9rem; margin:4px 0; }
  .cant.ok { color:#3d8f4a; }
  .cant.over { color:#f5c518; }
  #target { display:block; margin:12px auto; background:#111; border-radius:8px; }
  .note { font-size:0.75rem; color:#9a9386; }
  .status { font-size:0.85rem; margin:4px 0 10px; color:#b8b4a8; }
  .demo-badge { background:#5ec8e6; color:#111; padding:2px 6px; border-radius:3px; font-size:0.7rem; margin-left:6px; }
  .shot-list { max-height:160px; overflow-y:auto; font-size:0.9rem; }
  .shot-row { padding:6px 0; border-bottom:1px solid #222; cursor:pointer; }
  .stats { font-size:0.8rem; color:#b8b4a8; margin-top:8px; }
  .session-row { padding:8px 0; border-bottom:1px solid #222; cursor:pointer; }
  .banner { padding:8px 12px; margin:8px 16px; border-radius:6px; font-size:0.85rem; }
  .banner.red { background:#4a1a1a; color:#ff6b6b; }
  .banner.amber { background:#3a2e1a; color:#f5c518; }
  .banner.info { background:#1a2a3a; color:#5ec8e6; }
  .units { display:flex; gap:6px; margin:6px 0; }
  .units button { padding:8px 12px; min-height:44px; }
  .units button.active { background:#f5c518; color:#111; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chips button { padding:8px 12px; min-height:44px; font-size:0.8rem; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#111; border-top:1px solid #2a261c; padding:16px; transform:translateY(100%); transition:transform .25s; z-index:10; max-height:70vh; overflow-y:auto; }
  .sheet.open { transform:translateY(0); }
  .sheet h3 { margin:0 0 8px; }
</style>
</head>
<body>
<div class="top">
  <p><a href="index.html">← RailTrack</a></p>
  <h2 style="margin:4px 0 8px;">RailTrack <span class="demo-badge" id="demoBadge">DEMO</span></h2>
  <div class="status" id="status">Not connected · Demo mode</div>
</div>
<div id="banner"></div>

<div class="tabs">
  <button class="tab active" data-tab="shoot">Shoot</button>
  <button class="tab" data-tab="sessions">Sessions</button>
  <button class="tab" data-tab="settings">Settings</button>
</div>

<div class="view active" id="view-shoot">
  <div class="panel">
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
      <div>
        <label>Distance (m)</label>
        <input type="number" id="distance" value="300" min="1" step="10">
        
      </div>
      <div>
        <label>Units</label>
        <div class="units">
          <button type="button" data-unit="moa">MOA</button>
          <button type="button" data-unit="mil">mil</button>
          <button type="button" data-unit="mm" class="active">mm</button>
        </div>
      </div>
    </div>

    <div class="readout" id="readout">→ R 0.0  ↑ U 0.0 MOA</div>
    <div class="readout-sub" id="readoutSub"></div>
    <div class="cant ok" id="cant">Cant 0.0° — OK</div>

    <canvas id="target" width="300" height="300"></canvas>

    <div>
      <button id="connect">Connect sensor</button>
      <button id="start">Start session</button>
      <button id="end" disabled>End session</button>
      <button id="zero">Zero</button>
      <button id="undo">Undo</button>
      <button id="genShoot" style="display:none;">Generate shot</button>
    </div>

    <div class="stats" id="stats">Shots: 0</div>
    <div class="shot-list" id="shotList"></div>
    <p class="note">Auto-scale. Edge arrows for off-scale. Relative only.</p>
  </div>
</div>

<div class="view" id="view-sessions">
  <div class="panel">
    <h3 style="margin:0 0 8px;">Sessions</h3>
    <div id="sessionList"><p class="note">No sessions yet.</p></div>
    <button id="export">Export current CSV</button>
    <button id="exportAll">Export all</button>
  </div>
</div>

<div class="view" id="view-settings">
  <div class="panel">
    <h3 style="margin:0 0 8px;">Settings</h3>
    <label>Profile <select id="profile"><option value="long-range">Long-range rifle</option><option value="pistol">Pistol (experimental)</option></select></label>
    <label>Mount <select id="mount"><option value="top">Top rail</option><option value="under">Under rail</option></select></label>
    <label><input type="checkbox" id="demo" checked> Demo mode</label>
    <div id="demoControls" style="margin:8px 0;">
      <button id="gen">Generate shot</button>
    </div>
    <label>Shots shown <select id="nShots"><option>3</option><option>5</option><option selected>10</option><option>20</option></select></label>
    <label>Cant tolerance (°) <input type="number" id="cantTol" value="0.5" min="0.1" step="0.1" style="width:60px;"></label>
    <label>Default unit <select id="defUnit"><option value="moa">MOA</option><option value="mil">mil</option><option value="mm">mm</option></select></label>
    <button id="clear">Clear all data</button>
    <p class="note" style="margin-top:12px;">About — RailTrack v0.3 · Use Chrome or Edge for Bluetooth</p>
    <hr style="border-color:#2a261c; margin:16px 0;">
    <h4 style="margin:8px 0;">Developer</h4>
    <label><input type="checkbox" id="rawLog"> Raw log</label>
    <label>Rifle <input type="text" id="metaRifle" style="width:140px;"></label>
    <label>Caliber <input type="text" id="metaCal" style="width:100px;"></label>
    <label>Bullet <input type="text" id="metaBullet" style="width:120px;"></label>
    <label>Position <input type="text" id="metaPos" style="width:100px;"></label>
    <label>Shooter <input type="text" id="metaShooter" style="width:80px;"></label>
    <label>Temp °C <input type="number" id="metaTemp" style="width:60px;"></label>
    <label>Notes <input type="text" id="metaNotes" style="width:160px;"></label>
  </div>
</div>

<div class="sheet" id="sheet">
  <h3 id="sheetTitle">Shot</h3>
  <div id="sheetBody"></div>
  <button id="sheetClose">Close</button>
  <button id="sheetDelete">Delete shot</button>
</div>

<script>
const SERVICE_UUID = 'TBD-RAILTRACK-SERVICE-UUID';
const SHOT_CHAR = 'TBD-SHOT-CHAR-UUID';
const CMD_CHAR = 'TBD-CMD-CHAR-UUID';

const tabs = document.querySelectorAll('.tab');
const views = document.querySelectorAll('.view');
tabs.forEach(t => t.onclick = () => {
  tabs.forEach(x => x.classList.remove('active'));
  views.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('view-' + t.dataset.tab).classList.add('active');
  if (t.dataset.tab === 'sessions') renderSessions();
});

const distanceEl = document.getElementById('distance');
const readoutEl = document.getElementById('readout');
const readoutSubEl = document.getElementById('readoutSub');
const cantEl = document.getElementById('cant');
const canvas = document.getElementById('target');
const ctx = canvas.getContext('2d');
const genBtn = document.getElementById('gen');
const genShootBtn = document.getElementById('genShoot');
const zeroBtn = document.getElementById('zero');
const undoBtn = document.getElementById('undo');
const startBtn = document.getElementById('start');
const endBtn = document.getElementById('end');
const connectBtn = document.getElementById('connect');
const shotListEl = document.getElementById('shotList');
const statsEl = document.getElementById('stats');
const sessionListEl = document.getElementById('sessionList');
const demoChk = document.getElementById('demo');
const demoBadge = document.getElementById('demoBadge');
const nShotsEl = document.getElementById('nShots');
const cantTolEl = document.getElementById('cantTol');
const bannerEl = document.getElementById('banner');
const unitBtns = document.querySelectorAll('.units button');
const profileEl = document.getElementById('profile');
const mountEl = document.getElementById('mount');
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const sheetTitle = document.getElementById('sheetTitle');

let unit = 'mm';
let shots = [];
let sessions = JSON.parse(localStorage.getItem('railtrack.sessions.v1') || '[]');
let settings = JSON.parse(localStorage.getItem('railtrack.settings.v1') || '{}');
let currentSessionId = null;
let lastSessionId = null;
let sessionActive = false;
let yaw0 = 0, pitch0 = 0;
let badPackets = 0;
let bleDevice = null, bleServer = null, shotChar = null, cmdChar = null;
let battery = null;
let retryCount = 0;
let retryTimer = null;
let liveSensors = false;
let liveYaw = 0;
let livePitch = 0;
let orientationListener = null;

function saveSettings() {
  settings = {
    profile: profileEl.value,
    mount: mountEl.value,
    demo: demoChk.checked,
    nShots: nShotsEl.value,
    cantTol: cantTolEl.value,
    defUnit: document.getElementById('defUnit').value,
    rawLog: document.getElementById('rawLog').checked
  };
  localStorage.setItem('railtrack.settings.v1', JSON.stringify(settings));
}

function loadSettings() {
  if (settings.profile) profileEl.value = settings.profile;
  if (settings.mount) mountEl.value = settings.mount;
  if (settings.demo !== undefined) demoChk.checked = settings.demo;
  if (settings.nShots) nShotsEl.value = settings.nShots;
  if (settings.cantTol) cantTolEl.value = settings.cantTol;
  if (settings.defUnit) {
    unit = settings.defUnit;
    unitBtns.forEach(b => b.classList.toggle('active', b.dataset.unit === unit));
    document.getElementById('defUnit').value = settings.defUnit;
  }
  updateDemoUI();
}



unitBtns.forEach(b => b.onclick = () => {
  unitBtns.forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  unit = b.dataset.unit;
  update();
});

function degToRad(d) { return d * Math.PI / 180; }

function toUnit(deg, dist, u = unit) {
  if (u === 'moa') return deg * 60;
  if (u === 'mil') return deg * Math.PI / 180 * 1000;
  return dist * Math.tan(degToRad(deg)) * 1000;
}

function fmt(val, u = unit) {
  if (u === 'mm') return Math.round(val);
  return val.toFixed(1);
}

function dirLabel(val, isH) {
  if (Math.abs(val) < 0.05) return 'C';
  if (isH) return val > 0 ? '→ R' : '← L';
  return val > 0 ? '↑ U' : '↓ D';
}

function applyMount(yaw, pitch, mount) {
  const m = mount !== undefined ? mount : mountEl.value;
  if (m === 'under') return { yaw: -yaw, pitch: -pitch };
  return { yaw, pitch };
}

function update() {
  const dist = getDist();
  const last = shots.filter(s => !s.deleted).slice(-1)[0];
  let h = 0, v = 0, cant = 0;
  if (last) {
    const adj = applyMount(last.yaw - yaw0, last.pitch - pitch0);
    h = toUnit(adj.yaw, dist);
    v = toUnit(adj.pitch, dist);
    cant = last.cant || 0;
  }
  readoutEl.textContent = dirLabel(h, true) + ' ' + fmt(Math.abs(h)) + '  ' + dirLabel(v, false) + ' ' + fmt(Math.abs(v)) + ' ' + unit.toUpperCase();
  const others = ['moa','mil','mm'].filter(u => u !== unit);
  readoutSubEl.textContent = others.map(u => {
    const hh = last ? toUnit(applyMount(last.yaw - yaw0, last.pitch - pitch0).yaw, dist, u) : 0;
    const vv = last ? toUnit(applyMount(last.yaw - yaw0, last.pitch - pitch0).pitch, dist, u) : 0;
    return u.toUpperCase() + ' ' + dirLabel(hh,true) + ' ' + fmt(Math.abs(hh), u) + ' ' + dirLabel(vv,false) + ' ' + fmt(Math.abs(vv), u);
  }).join(' · ');

  const tol = +cantTolEl.value || 0.5;
  const over = Math.abs(cant) > tol;
  const cantTxt = Math.abs(cant) < 0.05 ? '0.0°' : Math.abs(cant).toFixed(1) + '° ' + (cant > 0 ? 'R' : 'L');
  cantEl.textContent = 'Cant ' + cantTxt + ' — ' + (over ? 'OVER' : 'OK');
  cantEl.className = 'cant ' + (over ? 'over' : 'ok');

  draw();
  renderList();
  renderStats();
  updateStatus();
}

function getDist() {
  if (sessionActive && currentSessionId) {
    const s = sessions.find(x => x.id === currentSessionId);
    if (s) return s.distance_m;
  }
  return +distanceEl.value || 300;
}

function draw() {
  const dist = getDist();
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2;
  const maxR = 120;
  ctx.clearRect(0,0,w,h);

  const visible = shots.filter(s => !s.deleted).slice(-(+nShotsEl.value||10));

  // Always draw rings + crosshair
  let maxVal = 1.0; // default scale when no shots
  if (visible.length) {
    const vals = visible.flatMap(s => {
      const adj = applyMount(s.yaw - yaw0, s.pitch - pitch0);
      return [Math.abs(toUnit(adj.yaw, dist)), Math.abs(toUnit(adj.pitch, dist))];
    });
    maxVal = Math.max(0.5, ...vals) * 1.2;
  }
  // include live aim in scale if session running
  if (sessionActive && liveSensors && (Math.abs(liveYaw) > 0.01 || Math.abs(livePitch) > 0.01)) {
    const lh = Math.abs(toUnit(liveYaw, dist));
    const lv = Math.abs(toUnit(livePitch, dist));
    maxVal = Math.max(maxVal, lh * 1.2, lv * 1.2, 0.5);
  }
  const scale = maxR / maxVal;

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.font = '10px Share Tech Mono';
  ctx.fillStyle = '#666';
  for (let i = 1; i <= 4; i++) {
    const r = (maxR / 4) * i;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();
    const val = (maxVal / 4) * i;
    ctx.fillText(fmt(val), cx - 12, cy - r - 4);
  }
  ctx.strokeStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(cx-maxR-10, cy); ctx.lineTo(cx+maxR+10, cy);
  ctx.moveTo(cx, cy-maxR-10); ctx.lineTo(cx, cy+maxR+10);
  ctx.stroke();

  if (!visible.length && !(sessionActive && liveSensors)) return;


  visible.forEach((s, i) => {
    const adj = applyMount(s.yaw - yaw0, s.pitch - pitch0);
    const hv = toUnit(adj.yaw, dist);
    const vv = toUnit(adj.pitch, dist);
    let px = cx + hv * scale;
    let py = cy - vv * scale;
    const dx = px - cx, dy = py - cy;
    const d = Math.hypot(dx, dy);
    const isLast = i === visible.length - 1;
    let onEdge = false;
    if (d > maxR - 2) {
      const f = (maxR - 2) / d;
      px = cx + dx * f;
      py = cy + dy * f;
      onEdge = true;
    }
    ctx.globalAlpha = isLast ? 1 : 0.35 + 0.5 * (i / visible.length);
    ctx.fillStyle = isLast ? '#f5c518' : '#888';
    ctx.beginPath();
    ctx.arc(px, py, isLast ? 8 : 4, 0, Math.PI*2);
    ctx.fill();
    if (onEdge) {
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#b8b4a8';
      ctx.font = '11px Share Tech Mono';
      ctx.fillText('→ ' + fmt(Math.hypot(hv, vv)), px + 10, py - 6);
    }
  });
  ctx.globalAlpha = 1;

  // Green live aim circle (only while session running + sensors)
  if (sessionActive && liveSensors) {
    const adj = applyMount(liveYaw, livePitch);
    const hv = toUnit(adj.yaw, dist);
    const vv = toUnit(adj.pitch, dist);
    let px = cx + hv * scale;
    let py = cy - vv * scale;
    const dx = px - cx, dy = py - cy;
    const d = Math.hypot(dx, dy);
    if (d > maxR - 4) {
      const f = (maxR - 4) / d;
      px = cx + dx * f;
      py = cy + dy * f;
    }
    ctx.strokeStyle = '#3d8f4a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(61,143,74,0.25)';
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI*2);
    ctx.fill();
  }
}

function renderList() {
  const n = +nShotsEl.value || 10;
  const list = shots.filter(s => !s.deleted).slice(-n).reverse();
  const dist = getDist();
  shotListEl.innerHTML = list.map((s, i) => {
    const adj = applyMount(s.yaw - yaw0, s.pitch - pitch0);
    const h = toUnit(adj.yaw, dist);
    const v = toUnit(adj.pitch, dist);
    const num = shots.filter(x => !x.deleted).length - i;
    return `<div class="shot-row" data-idx="${shots.indexOf(s)}">#${num}  ${dirLabel(h,true)} ${fmt(Math.abs(h))}  ${dirLabel(v,false)} ${fmt(Math.abs(v))} ${unit}</div>`;
  }).join('') || '<div class="note">No shots yet</div>';
  shotListEl.querySelectorAll('.shot-row').forEach(row => {
    row.onclick = () => openSheet(+row.dataset.idx);
  });
}

function renderStats() {
  const active = shots.filter(s => !s.deleted);
  if (!active.length) { statsEl.textContent = 'Shots: 0'; return; }
  const dist = getDist();
  const hs = active.map(s => toUnit(applyMount(s.yaw - yaw0, s.pitch - pitch0).yaw, dist));
  const vs = active.map(s => toUnit(applyMount(s.yaw - yaw0, s.pitch - pitch0).pitch, dist));
  const cants = active.map(s => s.cant || 0);
  const meanH = hs.reduce((a,b)=>a+b,0)/hs.length;
  const meanV = vs.reduce((a,b)=>a+b,0)/vs.length;
  const meanC = cants.reduce((a,b)=>a+b,0)/cants.length;
  const sd = arr => Math.sqrt(arr.reduce((a,v)=>a+(v - arr.reduce((x,y)=>x+y,0)/arr.length)**2,0)/(arr.length-1||1));
  let es = 0;
  for (let i = 0; i < hs.length; i++) {
    for (let j = i+1; j < hs.length; j++) {
      es = Math.max(es, Math.hypot(hs[i]-hs[j], vs[i]-vs[j]));
    }
  }
  const cantDir = Math.abs(meanC) < 0.05 ? '' : (meanC > 0 ? ' R' : ' L');
  statsEl.textContent = `Shots ${active.length} · Mean ${dirLabel(meanH,true)} ${fmt(Math.abs(meanH))} / ${dirLabel(meanV,false)} ${fmt(Math.abs(meanV))} · ES ${fmt(es)} · SD ${fmt(sd(hs))} / ${fmt(sd(vs))} · Cant ${Math.abs(meanC).toFixed(1)}°${cantDir}`;
}

function saveSessions() {
  localStorage.setItem('railtrack.sessions.v1', JSON.stringify(sessions));
}

function showSessionDetail(id) {
  const sess = sessions.find(s => s.id === id);
  if (!sess) return;
  const active = (sess.shots||[]).filter(x => !x.deleted);
  const dist = sess.distance_m;
  const y0 = sess.yaw0 || 0;
  const p0 = sess.pitch0 || 0;
  const hs = active.map(sh => toUnit(applyMount(sh.yaw - y0, sh.pitch - p0, sess.mount).yaw, dist));
  const vs = active.map(sh => toUnit(applyMount(sh.yaw - y0, sh.pitch - p0, sess.mount).pitch, dist));
  const cants = active.map(sh => sh.cant || 0);
  const meanH = hs.length ? hs.reduce((a,b)=>a+b,0)/hs.length : 0;
  const meanV = vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : 0;
  const meanC = cants.length ? cants.reduce((a,b)=>a+b,0)/cants.length : 0;
  let es = 0;
  for (let i=0;i<hs.length;i++) for (let j=i+1;j<hs.length;j++) es = Math.max(es, Math.hypot(hs[i]-hs[j], vs[i]-vs[j]));
  const cantDir = Math.abs(meanC) < 0.05 ? '' : (meanC > 0 ? ' R' : ' L');
  const html = `
    <div class="panel">
      <h3>${new Date(sess.startedAt).toLocaleString()}</h3>
      <div>${sess.distance_m} m · ${active.length} shots · ${sess.profile} · ${sess.mount}</div>
      <div class="stats">Mean ${dirLabel(meanH,true)} ${fmt(Math.abs(meanH))} / ${dirLabel(meanV,false)} ${fmt(Math.abs(meanV))} · ES ${fmt(es)} · Cant ${Math.abs(meanC).toFixed(1)}°${cantDir}</div>
      <canvas id="sessCanvas" width="280" height="280" style="background:#111;border-radius:8px;margin:8px auto;display:block;"></canvas>
      <div class="shot-list">${active.slice().reverse().map((s,i) => {
        const adj = applyMount(s.yaw - y0, s.pitch - p0, sess.mount);
        const h = toUnit(adj.yaw, dist);
        const v = toUnit(adj.pitch, dist);
        return `<div class="shot-row">#${active.length-i} ${dirLabel(h,true)} ${fmt(Math.abs(h))} ${dirLabel(v,false)} ${fmt(Math.abs(v))} ${unit}</div>`;
      }).join('')}</div>
      <button type="button" id="sessExport">Export CSV</button>
      <button type="button" id="sessDelete">Delete session</button>
      <button type="button" id="sessBack">Back</button>
    </div>`;
  sessionListEl.innerHTML = html;
  const c = document.getElementById('sessCanvas');
  const cctx = c.getContext('2d');
  const w = c.width, h = c.height, cx = w/2, cy = h/2, maxR = 110;
  if (active.length) {
    const vals = active.flatMap(s => {
      const adj = applyMount(s.yaw - y0, s.pitch - p0, sess.mount);
      return [Math.abs(toUnit(adj.yaw, dist)), Math.abs(toUnit(adj.pitch, dist))];
    });
    const maxVal = Math.max(0.5, ...vals) * 1.2;
    const scale = maxR / maxVal;
    cctx.strokeStyle = '#333';
    for (let i=1;i<=4;i++) {
      cctx.beginPath();
      cctx.arc(cx, cy, (maxR/4)*i, 0, Math.PI*2);
      cctx.stroke();
    }
    active.forEach(s => {
      const adj = applyMount(s.yaw - y0, s.pitch - p0, sess.mount);
      const hv = toUnit(adj.yaw, dist);
      const vv = toUnit(adj.pitch, dist);
      cctx.fillStyle = '#f5c518';
      cctx.beginPath();
      cctx.arc(cx + hv*scale, cy - vv*scale, 5, 0, Math.PI*2);
      cctx.fill();
    });
  }
  document.getElementById('sessBack').onclick = renderSessions;
  document.getElementById('sessDelete').onclick = () => {
    if (confirm('Delete this session?')) {
      sessions = sessions.filter(s => s.id !== id);
      saveSessions();
      renderSessions();
    }
  };
  document.getElementById('sessExport').onclick = () => {
    let csv = 'session_id,started_at,profile,distance_m,shot_n,t_ms,yaw_deg,pitch_deg,cant_deg,h_mm,v_mm,h_moa,v_moa,h_mil,v_mil,battery_pct,flags,call,impact_h_mm,impact_v_mm\n';
    active.forEach(s => {
      const adj = applyMount(s.yaw - y0, s.pitch - p0, sess.mount);
      const hmm = dist * Math.tan(degToRad(adj.yaw)) * 1000;
      const vmm = dist * Math.tan(degToRad(adj.pitch)) * 1000;
      csv += `${sess.id},${sess.startedAt},${sess.profile||''},${dist},${s.n},${s.t},${adj.yaw.toFixed(3)},${adj.pitch.toFixed(3)},${(s.cant||0).toFixed(2)},${Math.round(hmm)},${Math.round(vmm)},${(adj.yaw*60).toFixed(1)},${(adj.pitch*60).toFixed(1)},${(adj.yaw*Math.PI/180*1000).toFixed(1)},${(adj.pitch*Math.PI/180*1000).toFixed(1)},${s.bat||''},${s.flags||0},${s.call||''},${s.impactH||''},${s.impactV||''}\n`;
    });
    downloadCSV(csv, `railtrack_${dateStr(sess.startedAt)}_${sess.id}.csv`);
  };
}

function renderSessions() {
  if (!sessions.length) {
    sessionListEl.innerHTML = '<p class="note">No sessions yet.</p>';
    return;
  }
  sessionListEl.innerHTML = sessions.slice().reverse().map(s => {
    const d = new Date(s.startedAt).toLocaleString();
    const active = (s.shots||[]).filter(x => !x.deleted);
    const cnt = active.length;
    let mean = '', es = '';
    if (cnt) {
      const dist = s.distance_m;
      const hs = active.map(sh => toUnit(applyMount(sh.yaw - (s.yaw0||0), sh.pitch - (s.pitch0||0), s.mount).yaw, dist));
      const vs = active.map(sh => toUnit(applyMount(sh.yaw - (s.yaw0||0), sh.pitch - (s.pitch0||0), s.mount).pitch, dist));
      const mh = hs.reduce((a,b)=>a+b,0)/hs.length;
      const mv = vs.reduce((a,b)=>a+b,0)/vs.length;
      let maxes = 0;
      for (let i=0;i<hs.length;i++) for (let j=i+1;j<hs.length;j++) maxes = Math.max(maxes, Math.hypot(hs[i]-hs[j], vs[i]-vs[j]));
      mean = ` · mean ${fmt(mh)}/${fmt(mv)}`;
      es = ` · ES ${fmt(maxes)}`;
    }
    return `<div class="session-row" data-id="${s.id}">${d} · ${s.distance_m} m · ${cnt} shots${mean}${es}</div>`;
  }).join('');
  sessionListEl.querySelectorAll('.session-row').forEach(row => {
    row.onclick = () => showSessionDetail(row.dataset.id);
  });
}


function startLiveSensors() {
  if (liveSensors) return;
  const start = () => {
    liveSensors = true;
    orientationListener = (e) => {
      // Phone held upright in hand (screen facing shooter, top of phone forward/up).
      // gamma: left/right tilt. Invert so left tilt = left on plot.
      // beta: ~90 when upright. Relative pitch from upright.
      const gamma = e.gamma || 0;
      const beta = e.beta || 90;
      liveYaw = -gamma * 0.08;          // inverted left-right
      livePitch = (beta - 90) * 0.08;   // relative to upright
      if (sessionActive) draw();
    };
    window.addEventListener('deviceorientation', orientationListener);
    setBanner('Phone sensors active for live aim', 'info');
    setTimeout(() => { if (bannerEl.querySelector('.banner.info')?.textContent.includes('sensors')) setBanner(''); }, 2000);
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(p => {
      if (p === 'granted') start();
      else setBanner('Sensor permission denied', 'amber');
    }).catch(() => setBanner('Sensor permission failed', 'amber'));
  } else {
    start();
  }
}
function stopLiveSensors() {
  if (orientationListener) {
    window.removeEventListener('deviceorientation', orientationListener);
    orientationListener = null;
  }
  liveSensors = false;
  liveYaw = 0;
  livePitch = 0;
}
function updateStatus() {
  const bat = (typeof battery === 'number') ? ` · ${battery}%` : '';
  const conn = bleServer ? 'Connected' : 'Not connected';
  const demo = (demoChk.checked && !bleServer) ? ' · Demo mode' : '';
  document.getElementById('status').textContent = conn + bat + demo;
  if (typeof battery === 'number' && battery < 15) {
    setBanner('Low battery', 'amber');
  } else if (typeof battery === 'number' && battery >= 15) {
    const b = bannerEl.querySelector('.banner.amber');
    if (b && b.textContent.includes('Low battery')) setBanner('');
  }
}

function updateDemoUI() {
  demoBadge.style.display = demoChk.checked ? 'inline' : 'none';
  document.getElementById('demoControls').style.display = demoChk.checked ? 'block' : 'none';
  genShootBtn.style.display = demoChk.checked ? 'inline-block' : 'none';
  updateStatus();
}

function setBanner(html, cls) {
  bannerEl.innerHTML = html ? `<div class="banner ${cls}">${html}</div>` : '';
}

function openSheet(idx) {
  const s = shots[idx];
  if (!s) return;
  const dist = getDist();
  const adj = applyMount(s.yaw - yaw0, s.pitch - pitch0);
  const hmm = dist * Math.tan(degToRad(adj.yaw)) * 1000;
  const vmm = dist * Math.tan(degToRad(adj.pitch)) * 1000;
  const hmoa = adj.yaw * 60;
  const vmoa = adj.pitch * 60;
  const hmil = adj.yaw * Math.PI/180*1000;
  const vmil = adj.pitch * Math.PI/180*1000;
  sheetTitle.textContent = 'Shot #' + s.n;
  sheetBody.innerHTML = `
    <div>Time: ${new Date(s.t).toLocaleTimeString()}</div>
    <div>H: ${Math.round(hmm)} mm · ${hmoa.toFixed(1)} MOA · ${hmil.toFixed(1)} mil</div>
    <div>V: ${Math.round(vmm)} mm · ${vmoa.toFixed(1)} MOA · ${vmil.toFixed(1)} mil</div>
    <div>Raw yaw ${s.yaw.toFixed(2)}° · pitch ${s.pitch.toFixed(2)}° · cant ${(s.cant||0).toFixed(2)}°</div>
    <div>Distance ${dist} m · Recoil ${s.recoil != null ? s.recoil : 'n/a'}</div>
    <div style="margin-top:8px;">Call:
      <select id="callSel">${['','good','L','R','H','Lo','flinch'].map(c => `<option value="${c}" ${s.call===c?'selected':''}>${c||'—'}</option>`).join('')}</select>
    </div>
    <div>Impact H mm <input type="number" id="impH" value="${s.impactH||''}" style="width:70px;"> V mm <input type="number" id="impV" value="${s.impactV||''}" style="width:70px;"></div>
  `;
  sheet.dataset.idx = idx;
  sheet.classList.add('open');
}

document.getElementById('sheetClose').onclick = () => {
  const idx = +sheet.dataset.idx;
  const s = shots[idx];
  if (s) {
    const call = document.getElementById('callSel')?.value;
    const ih = document.getElementById('impH')?.value;
    const iv = document.getElementById('impV')?.value;
    if (call) s.call = call; else delete s.call;
    if (ih !== '') s.impactH = +ih;
    if (iv !== '') s.impactV = +iv;
    let found = false;
    if (currentSessionId) {
      const sess = sessions.find(x => x.id === currentSessionId);
      if (sess && sess.shots && sess.shots.some(x => x.n === s.n && x.t === s.t)) {
        sess.shots = shots.slice();
        found = true;
      }
    }
    if (!found) {
      for (const sess of sessions) {
        const si = (sess.shots||[]).findIndex(x => x.n === s.n && x.t === s.t);
        if (si >= 0) { sess.shots[si] = {...s}; found = true; break; }
      }
    }
    if (found) saveSessions();
  }
  sheet.classList.remove('open');
};

document.getElementById('sheetDelete').onclick = () => {
  const idx = +sheet.dataset.idx;
  if (shots[idx]) shots[idx].deleted = true;
  if (currentSessionId) {
    const sess = sessions.find(x => x.id === currentSessionId);
    if (sess) sess.shots = shots.slice();
    saveSessions();
  }
  sheet.classList.remove('open');
  update();
};

    saveSessions();
  }

function addDemoShot() {
  if (!demoChk.checked) return;
  let yaw, pitch;
  if (liveSensors && sessionActive) {
    yaw = liveYaw;
    pitch = livePitch;
  } else {
    yaw = (Math.random() - 0.5) * 0.1;
    pitch = (Math.random() - 0.5) * 0.08;
  }
  const cant = (Math.random() - 0.5) * 0.6;
  const shot = { n: shots.length+1, t: Date.now(), yaw, pitch, cant, bat: battery || 85, flags: 2, deleted: false };
  if (sessionActive) {
    shots.push(shot);
    const sess = sessions.find(s => s.id === currentSessionId);
    if (sess) sess.shots = shots.slice();
    saveSessions();
  } else {
    shots.push(shot);
  }
  update();
}

genBtn.onclick = addDemoShot;
genShootBtn.onclick = addDemoShot;

async function tryReconnect() {
  if (!bleDevice || retryCount >= 10) {
    setBanner('Sensor disconnected. <button type="button" id="reconnect">Reconnect</button>', 'red');
    document.getElementById('reconnect')?.addEventListener('click', () => { retryCount = 0; connectBtn.click(); });
    return;
  }
  retryCount++;
  try {
    bleServer = await bleDevice.gatt.connect();
    const svc = await bleServer.getPrimaryService(SERVICE_UUID);
    shotChar = await svc.getCharacteristic(SHOT_CHAR);
    cmdChar = await svc.getCharacteristic(CMD_CHAR);
    await shotChar.startNotifications();
    shotChar.addEventListener('characteristicvaluechanged', e => handlePacket(e.target.value));
    setBanner('');
    retryCount = 0;
    updateStatus();
  } catch (e) {
    retryTimer = setTimeout(tryReconnect, 3000);
  }
}
function onDisconnect() {
  setBanner('Sensor disconnected, reconnecting…', 'red');
  bleServer = null;
  updateStatus();
  retryCount = 0;
  tryReconnect();
}

connectBtn.onclick = async () => {
  if (!navigator.bluetooth) {
    setBanner('Use Chrome on Android or desktop. <button type="button" id="forceDemo">Use Demo</button>', 'info');
    document.getElementById('forceDemo')?.addEventListener('click', () => { demoChk.checked = true; updateDemoUI(); setBanner(''); });
    return;
  }
  try {
    setBanner('Scanning…', 'info');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: ['battery_service']
    });
    bleServer = await bleDevice.gatt.connect();
    const svc = await bleServer.getPrimaryService(SERVICE_UUID);
    shotChar = await svc.getCharacteristic(SHOT_CHAR);
    cmdChar = await svc.getCharacteristic(CMD_CHAR);
    await shotChar.startNotifications();
    shotChar.addEventListener('characteristicvaluechanged', e => handlePacket(e.target.value));
    try {
      const batSvc = await bleServer.getPrimaryService('battery_service');
      const batChar = await batSvc.getCharacteristic('battery_level');
      battery = (await batChar.readValue()).getUint8(0);
    } catch(e) {}
    setBanner('');
    bleDevice.addEventListener('gattserverdisconnected', onDisconnect);
    updateStatus();
  } catch (e) {
    setBanner((e.message || 'Permission denied') + ' <button type="button" id="retry">Retry</button>', 'red');
    document.getElementById('retry')?.addEventListener('click', () => connectBtn.click());
  }
};

window.handlePacket = function(dv) {
  try {
    if (dv.byteLength === 14) {
      const n = dv.getUint16(0, true);
      const t = dv.getUint32(2, true);
      const yaw = dv.getInt16(6, true) / 100;
      const pitch = dv.getInt16(8, true) / 100;
      const cant = dv.getInt16(10, true) / 100;
      const bat = dv.getUint8(12);
      const flags = dv.getUint8(13);
      battery = bat;
      const shot = { n, t, yaw, pitch, cant, bat, flags, deleted: false };
      if (sessionActive) {
        shots.push(shot);
        const sess = sessions.find(s => s.id === currentSessionId);
        if (sess) sess.shots = shots.slice();
        saveSessions();
      } else {
        setBanner('Shot received - press Start session to record', 'info');
      }
      update();
      return;
    }
    const text = new TextDecoder().decode(dv);
    const pkt = JSON.parse(text);
    if (typeof pkt.yaw === 'number') {
      if (typeof pkt.bat === 'number') battery = pkt.bat;
      const shot = { n: pkt.n||shots.length+1, t: pkt.t||Date.now(), yaw: pkt.yaw, pitch: pkt.pitch, cant: pkt.cant||0, bat: pkt.bat, flags: pkt.flags||0, deleted: false };
      if (sessionActive) {
        shots.push(shot);
        const sess = sessions.find(s => s.id === currentSessionId);
        if (sess) sess.shots = shots.slice();
        saveSessions();
      } else {
        setBanner('Shot received - press Start session to record', 'info');
      }
      update();
      return;
    }
  } catch(e) {}
  badPackets++;
};

function downloadCSV(rows, name) {
  const blob = new Blob([rows], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function dateStr(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

document.getElementById('export').onclick = () => {
  const sid = currentSessionId || lastSessionId;
  if (!sid) return alert('No session');
  const sess = sessions.find(s => s.id === sid);
  if (!sess) return alert('Session not found');
  const active = (sess.shots || []).filter(s => !s.deleted);
  if (!active.length) return alert('No shots');
  const dist = sess.distance_m;
  const y0 = sess.yaw0 || 0;
  const p0 = sess.pitch0 || 0;
  let csv = 'session_id,started_at,profile,distance_m,shot_n,t_ms,yaw_deg,pitch_deg,cant_deg,h_mm,v_mm,h_moa,v_moa,h_mil,v_mil,battery_pct,flags,call,impact_h_mm,impact_v_mm\n';
  active.forEach(s => {
    const adj = applyMount(s.yaw - y0, s.pitch - p0, sess.mount);
    const hmm = dist * Math.tan(degToRad(adj.yaw)) * 1000;
    const vmm = dist * Math.tan(degToRad(adj.pitch)) * 1000;
    csv += `${sess.id},${sess.startedAt},${sess.profile||''},${dist},${s.n},${s.t},${adj.yaw.toFixed(3)},${adj.pitch.toFixed(3)},${(s.cant||0).toFixed(2)},${Math.round(hmm)},${Math.round(vmm)},${(adj.yaw*60).toFixed(1)},${(adj.pitch*60).toFixed(1)},${(adj.yaw*Math.PI/180*1000).toFixed(1)},${(adj.pitch*Math.PI/180*1000).toFixed(1)},${s.bat||''},${s.flags||0},${s.call||''},${s.impactH||''},${s.impactV||''}\n`;
  });
  downloadCSV(csv, `railtrack_${dateStr(sess.startedAt)}_${sess.id}.csv`);
};

document.getElementById('exportAll').onclick = () => {

  sessions.forEach(sess => {

      const adj = applyMount(s.yaw - y0, s.pitch - p0, sess.mount);
      const dist = sess.distance_m;
      const hmm = dist * Math.tan(degToRad(adj.yaw)) * 1000;
      const vmm = dist * Math.tan(degToRad(adj.pitch)) * 1000;
      csv += `${sess.id},${sess.startedAt},${sess.profile||''},${dist},${s.n},${s.t},${adj.yaw.toFixed(3)},${adj.pitch.toFixed(3)},${(s.cant||0).toFixed(2)},${Math.round(hmm)},${Math.round(vmm)},${(adj.yaw*60).toFixed(1)},${(adj.pitch*60).toFixed(1)},${(adj.yaw*Math.PI/180*1000).toFixed(1)},${(adj.pitch*Math.PI/180*1000).toFixed(1)},${s.bat||''},${s.flags||0},${s.call||''},${s.impactH||''},${s.impactV||''}\n`;
    });
  });
  downloadCSV(csv, `railtrack_all_${dateStr(Date.now())}.csv`);
};

document.getElementById('clear').onclick = () => {
  if (confirm('Clear all sessions?')) {
    sessions = [];
    shots = [];

};
